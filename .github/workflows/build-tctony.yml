name: Build tctony cmux package

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/build-tctony.yml
      - .gitmodules
      - .xcode-version
      - build-cmux.sh
      - ghostty
      - ghostty.h
      - scripts/ensure-ghosttykit.sh
      - scripts/install-zig-ci.sh
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag for a signed Sparkle dry run
        required: false
        type: string
      require_ghosttykit_cache:
        description: Fail unless develop has already populated the exact GhosttyKit cache
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        description: Release tag used to configure Sparkle and generate appcast.xml
        required: false
        type: string
      require_ghosttykit_cache:
        description: Fail unless develop has already populated the exact GhosttyKit cache
        required: false
        default: false
        type: boolean
    secrets:
      APPLE_ID_PASS:
        required: true
      MACOS_APPLICATION_CERT_P12:
        required: true
      MACOS_APPLICATION_CERT_P12_PASS:
        required: true
      SPARKLE_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  build-package:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CMUX_GHOSTTYKIT_NO_PREBUILT: 1
      ZIG_REQUIRED: 0.15.2

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Set package paths
        run: |
          echo "APP_PATH=$RUNNER_TEMP/cmux-tctony/Build/Products/Release/cmux.app" >> "$GITHUB_ENV"
          echo "APPCAST_PATH=$RUNNER_TEMP/appcast.xml" >> "$GITHUB_ENV"
          echo "DMG_PATH=$RUNNER_TEMP/cmux-tctony.dmg" >> "$GITHUB_ENV"

      - name: Select pinned Xcode
        run: |
          set -euo pipefail
          XCODE_VERSION="$(tr -d '[:space:]' < .xcode-version)"
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "Pinned Xcode is not installed: $XCODE_APP" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version

      - name: Set cache metadata
        id: cache-metadata
        run: |
          set -euo pipefail
          GHOSTTY_SHA="$(git -C ghostty rev-parse HEAD)"
          GHOSTTY_INPUTS_KEY="$(
            git hash-object \
              scripts/ensure-ghosttykit.sh \
              scripts/install-zig-ci.sh \
              build-cmux.sh \
              ghostty.h \
              | shasum -a 256 \
              | awk '{print substr($1, 1, 12)}'
          )"
          MACOS_MAJOR="$(sw_vers -productVersion | cut -d. -f1)"
          PLATFORM_KEY="$RUNNER_OS-$MACOS_MAJOR-$RUNNER_ARCH"
          XCODE_KEY="$(xcodebuild -version | shasum -a 256 | awk '{print substr($1, 1, 12)}')"
          SWIFTPM_KEY="$(
            shasum -a 256 \
              cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
              | awk '{print substr($1, 1, 12)}'
          )"
          GHOSTTY_CACHE_KEY="ghosttykit-$PLATFORM_KEY-$XCODE_KEY"
          GHOSTTY_CACHE_KEY="$GHOSTTY_CACHE_KEY-zig-$ZIG_REQUIRED-$GHOSTTY_SHA-$GHOSTTY_INPUTS_KEY"
          echo "derived_prefix=derived-data-$PLATFORM_KEY-$XCODE_KEY" >> "$GITHUB_OUTPUT"
          echo "ghostty_key=$GHOSTTY_CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "swiftpm_key=swiftpm-$PLATFORM_KEY-$XCODE_KEY-$SWIFTPM_KEY" >> "$GITHUB_OUTPUT"
          echo "zig_key=zig-$PLATFORM_KEY-$ZIG_REQUIRED" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit
        id: ghosttykit-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/cmux/ghosttykit
          key: ${{ steps.cache-metadata.outputs.ghostty_key }}

      - name: Require develop-prewarmed GhosttyKit cache
        if: inputs.require_ghosttykit_cache && steps.ghosttykit-cache.outputs.cache-hit != 'true'
        env:
          GHOSTTYKIT_CACHE_KEY: ${{ steps.cache-metadata.outputs.ghostty_key }}
        run: |
          echo "Missing GhosttyKit cache: $GHOSTTYKIT_CACHE_KEY" >&2
          echo "Run build-tctony.yml on develop and wait for it to succeed before releasing." >&2
          exit 1

      - name: Cache SwiftPM
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/.spm-cache
          key: ${{ steps.cache-metadata.outputs.swiftpm_key }}

      - name: Cache DerivedData
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/cmux-tctony
          key: ${{ steps.cache-metadata.outputs.derived_prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.cache-metadata.outputs.derived_prefix }}-

      - name: Remove runner-specific module caches
        run: |
          rm -rf "$RUNNER_TEMP/cmux-tctony/ModuleCache.noindex"
          rm -rf "$RUNNER_TEMP/cmux-tctony/SDKStatCaches.noindex"

      - name: Cache Zig
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/cmux/zig
          key: ${{ steps.cache-metadata.outputs.zig_key }}

      - name: Validate organization signing configuration
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.MACOS_APPLICATION_CERT_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APPLICATION_CERT_P12_PASS }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_APPLICATION_CERT_NAME }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE_P12 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_ID_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing organization signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "Missing SPARKLE_PRIVATE_KEY for release build" >&2
            exit 1
          fi

      - name: Validate release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          APP_VERSION="$(
            sed -n 's/^[[:space:]]*MARKETING_VERSION = \([^;]*\);/\1/p' cmux.xcodeproj/project.pbxproj \
              | sort -u
          )"
          if [[ -z "$APP_VERSION" || "$APP_VERSION" == *$'\n'* ]]; then
            echo "Unable to determine one MARKETING_VERSION from cmux.xcodeproj" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$APP_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match app version v$APP_VERSION" >&2
            exit 1
          fi

      - name: Test Nucleo FFI artifact verifier
        run: ./tests/test_nucleo_ffi_artifact_verifier.sh

      - name: Install Zig
        run: ./scripts/install-zig-ci.sh

      - name: Import organization signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.MACOS_APPLICATION_CERT_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_APPLICATION_CERT_P12_PASS }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/tctony-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/tctony-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

      - name: Build signed Release app
        env:
          CMUX_BUNDLE_ID: com.tctony.cmux
          CMUX_DERIVED_DATA: ${{ runner.temp }}/cmux-tctony
          CMUX_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          CMUX_REPO: ${{ github.workspace }}
          CMUX_REVEAL_IN_FINDER: 0
          CMUX_SIGNING_IDENTITY: ${{ vars.MACOS_APPLICATION_CERT_NAME }}
          CMUX_SPM_CACHE: ${{ github.workspace }}/.spm-cache
        run: ./build-cmux.sh

      - name: Configure Sparkle for tctony release
        if: inputs.release_tag != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          APP_PLIST="$APP_PATH/Contents/Info.plist"
          SPARKLE_PUBLIC_KEY="$(swift scripts/derive_sparkle_public_key.swift "$SPARKLE_PRIVATE_KEY")"
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$APP_PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$APP_PLIST" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string $SPARKLE_PUBLIC_KEY" "$APP_PLIST"
          /usr/libexec/PlistBuddy \
            -c "Add :SUFeedURL string https://github.com/tctony-labs/cmux/releases/latest/download/appcast.xml" \
            "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$APP_PLIST"
          /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$APP_PLIST"

      - name: Re-sign app for distribution
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_APPLICATION_CERT_NAME }}
        run: |
          set -euo pipefail
          ./scripts/sign-cmux-bundle.sh \
            "$APP_PATH" \
            cmux.tctony.entitlements \
            "$APPLE_SIGNING_IDENTITY"

      - name: Notarize app
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          NOTARY_ZIP="$RUNNER_TEMP/cmux-tctony-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          rm -f "$NOTARY_ZIP"

      - name: Create and notarize DMG
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASS }}
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_APPLICATION_CERT_NAME }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG_ROOT="$RUNNER_TEMP/cmux-tctony-dmg"
          mkdir -p "$DMG_ROOT"
          ditto "$APP_PATH" "$DMG_ROOT/cmux.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname cmux \
            -srcfolder "$DMG_ROOT" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Generate Sparkle appcast
        if: inputs.release_tag != ''
        env:
          DOWNLOAD_URL_PREFIX: https://github.com/tctony-labs/cmux/releases/download/${{ inputs.release_tag }}/
          RELEASE_NOTES_URL: https://github.com/tctony-labs/cmux/releases/tag/${{ inputs.release_tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/sparkle_generate_appcast.sh "$DMG_PATH" "${{ inputs.release_tag }}" "$APPCAST_PATH"

      - name: Upload DMG
        if: inputs.release_tag == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-tctony
          path: ${{ runner.temp }}/cmux-tctony.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload release assets
        if: inputs.release_tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-tctony-release
          path: |
            ${{ runner.temp }}/cmux-tctony.dmg
            ${{ runner.temp }}/appcast.xml
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/tctony-signing.keychain-db" || true
