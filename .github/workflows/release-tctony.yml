name: Release tctony cmux

on:
  schedule:
    # 03:33 Asia/Shanghai (UTC+8), every day.
    - cron: "33 19 * * *"
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the app version, for example v0.64.15
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tctony
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.scheduled.outputs.tag || steps.requested.outputs.tag }}

    steps:
      - name: Checkout develop for scheduled release
        if: github.event_name == 'schedule'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/heads/develop
          fetch-depth: 0

      - name: Test scheduled release preparation
        if: github.event_name == 'schedule'
        run: python3 tests/test_prepare_scheduled_release.py

      - name: Prepare scheduled patch release
        if: github.event_name == 'schedule'
        id: scheduled
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-scheduled-release.py

      - name: Select requested release tag
        if: github.event_name != 'schedule'
        id: requested
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-package:
    needs: prepare-release
    if: needs.prepare-release.outputs.tag != ''
    uses: ./.github/workflows/build-tctony.yml
    with:
      release_tag: ${{ needs.prepare-release.outputs.tag }}
    secrets: inherit

  publish-release:
    needs: [prepare-release, build-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-tctony-release
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            release-assets/cmux-tctony.dmg
            release-assets/appcast.xml
            release-assets/cmux-tctony-symbols.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
