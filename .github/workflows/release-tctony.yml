name: Release tctony cmux

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the app version, for example v0.64.15
        required: true
        type: string

concurrency:
  group: release-tctony-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-package:
    uses: ./.github/workflows/build-tctony.yml
    with:
      release_tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  publish-release:
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-tctony-release
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            release-assets/cmux-tctony.dmg
            release-assets/appcast.xml
          generate_release_notes: true
